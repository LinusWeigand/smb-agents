<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F7F7" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="google-site-verification" content="_kozibV153hkefRLa8rPuR9-5FAgKUG-lxGwYHs-Myc" />

    <!-- favicon.ico first: Google and several other crawlers request that classic
         path before they read these tags at all. The ?v= on the PNGs is a cache
         buster - without a changing URL Google's favicon store, which refreshes
         on its own slow schedule, has no reason to fetch the tile again. Bump the
         number whenever the icon changes. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts are self-hosted (see src/index.css). Preload the two latin subsets
         that every page needs immediately; the rest load on demand. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/geist-latin.woff2" crossorigin />

    <!-- Critical CSS inline to prevent render-blocking -->
    <style>
      .font-serif { font-family: 'Geist', system-ui, sans-serif; }
      .font-medium { font-weight: 500 !important; }
      .font-semibold { font-weight: 600 !important; }
      body { margin: 0; background: transparent; }
      html { background-color: #F7F7F7; }
      #root { min-height: 100vh; background: transparent; }
      h1 { font-family: 'Geist', system-ui, sans-serif; }
    </style>

    <!-- Site-wide meta (identical on every route) -->
    <meta name="keywords" content="Orakis, company brain, AI task management, AI project management, AI knowledge base, team coordination, AI assistant, goals and tasks, daily briefing, KI Aufgabenverwaltung, KI Projektmanagement, Wissensdatenbank" />
    <meta name="author" content="Orakis AI" />
    <meta name="geo.region" content="DE" />
    <meta name="geo.placename" content="Stuttgart" />
    <meta name="geo.position" content="48.7758;9.1829" />
    <meta name="ICBM" content="48.7758, 9.1829" />
    <meta name="category" content="Task Management, Project Management, AI Assistant, Knowledge Management, Team Collaboration, Productivity Software, SaaS" />
    <meta name="classification" content="AI Task and Project Management, Company Knowledge Base, AI Assistant, Team Collaboration, Productivity Software" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Orakis" />
    <meta property="og:locale" content="en_US" />

    <!-- Preview image for shared links. Absolute URL is required: crawlers
         resolve it without a base. No ?v= here on purpose - social networks
         cache by URL and re-scraping is manual, so a stable address is worth
         more than a bustable one. -->
    <meta property="og:image" content="https://www.orakis.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Orakis - Company Brain for Task Management" />
    <meta name="twitter:image" content="https://www.orakis.com/og-image.png" />

    <!-- Per-route block. On the deployed site a build step rewrites everything
         between these markers for each prerendered route; the values below are
         the ones for "/". -->
    <!-- SEO:START -->
    <title>Orakis - Company Brain for Task and Knowledge Management</title>
    <meta name="description" content="Know what's happening, what matters, and what to do next." />
    <link rel="canonical" href="https://www.orakis.com/" />
    <meta property="og:title" content="Orakis - Company Brain for Task and Knowledge Management" />
    <meta property="og:description" content="Know what's happening, what matters, and what to do next." />
    <meta property="og:url" content="https://www.orakis.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Orakis - Company Brain for Task and Knowledge Management" />
    <meta name="twitter:description" content="Know what's happening, what matters, and what to do next." />
    <script type="application/ld+json" id="seo-head-jsonld">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebPage",
            "name": "Orakis – Company Brain for Task and Knowledge Management",
            "description": "Orakis keeps goals, tasks, documents and knowledge in one place, with an AI assistant that knows your context – so your team knows what's happening, what to do, and when to do it.",
            "url": "https://www.orakis.com/",
            "inLanguage": "en",
            "isPartOf": {
              "@type": "WebSite",
              "name": "Orakis",
              "url": "https://www.orakis.com/"
            },
            "speakable": {
              "@type": "SpeakableSpecification",
              "cssSelector": [
                "h1",
                ".hero-description"
              ]
            }
          },
          {
            "@type": "BreadcrumbList",
            "itemListElement": [
              {
                "@type": "ListItem",
                "position": 1,
                "name": "Home",
                "item": "https://www.orakis.com/"
              }
            ]
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What is Orakis?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Orakis is the company brain for task and knowledge management. It remembers what you and your team know, and keeps track of what's getting done: projects, tasks, decisions, context. You manage your projects and build up your knowledge as you go. And the AI tells you what needs a decision, and manages tasks for you. People come and go. Orakis stays."
                }
              },
              {
                "@type": "Question",
                "name": "What problem does Orakis solve?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Most organizations lose significant time to coordination overhead. Waiting for updates, misaligned priorities, and scattered information. Orakis eliminates these bottlenecks by automating data exchange, surfacing real-time insights, and keeping every team member aligned on what matters most."
                }
              },
              {
                "@type": "Question",
                "name": "How does Orakis help?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Leaders always understand what is happening across teams, projects, and people, while team members always know exactly what to work on without having to ask. This means faster and more confident decisions backed by live metrics and automated reporting instead of manual status updates. Orakis provides clarity on what to do, when to do it, and why it matters. By automating the flow of information, it removes the guesswork and lets everyone focus on high-impact work instead of chasing updates or sitting in alignment meetings."
                }
              },
              {
                "@type": "Question",
                "name": "Can I try Orakis for free?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. You can try Orakis free for 7 days, no credit card required. Every feature is unlocked during the trial."
                }
              },
              {
                "@type": "Question",
                "name": "How long does it take to set up?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Less than 5 minutes."
                }
              },
              {
                "@type": "Question",
                "name": "What tools does Orakis integrate with?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Orakis connects to the tools you already use, like Outlook, Gmail, and Google Calendar, with more integrations on the way. And through MCP, you can bring your own LLM: Claude, ChatGPT, or anything else that supports MCP, and give it direct access to Orakis."
                }
              },
              {
                "@type": "Question",
                "name": "Is my data safe?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Your data is stored in Frankfurt, Germany, encrypted at rest and in transit. We don't train on it, and we don't touch it beyond what it takes to run your workspace. Your data stays yours."
                }
              },
              {
                "@type": "Question",
                "name": "Can I change or cancel my plan anytime?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. You can upgrade, downgrade, or cancel anytime from your billing portal."
                }
              },
              {
                "@type": "Question",
                "name": "Who are we?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Orakis is a startup currently based in Stuttgart, Germany. We're building the company brain for task and knowledge management."
                }
              }
            ]
          }
        ]
      }
    </script>
    <!-- SEO:END -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
